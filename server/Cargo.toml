[package]
name = "server"
version = "0.1.0"
edition = "2021"
default-run = "server"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
axum = "0.8.8"
dog-auth = "0.3.0"
dog-auth-local = "0.3.0"
dog-transport = { version = "0.3.0", features = ["http"] }
dog-core = { version = "0.3.0", features = ["serde", "adapters"] }
dog-typedb = "0.3.0"
dotenvy = "0.15.7"
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "time", "net", "signal", "fs"] }
tower-http = { version = "0.6.8", features = ["fs", "cors"] }
tracing = "0.1.41"
regex = "1.11.1"
once_cell = "1.20.2"
uuid = { version = "1.11.0", features = ["v4"] }
typedb-driver = "=3.13.6"

sha2 = "0.10"
hmac = "0.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
subtle = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "form"] }
chrono = "0.4"

bcrypt = "0.19"

[dev-dependencies]
tempfile = "3"
http = "1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
