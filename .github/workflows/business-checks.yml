name: Business checks
on:
  pull_request:
    paths: ['server/**', 'render.yaml', '.github/workflows/business-checks.yml']
  push:
    branches: [main]
    paths: ['server/**', 'render.yaml', '.github/workflows/business-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: business-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler pkg-config libssl-dev
      - name: Rust toolchain
        run: rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo build --locked --all-targets
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --doc
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/frontend/data-client.test.mjs
      - run: cargo clippy --locked --all-targets -- -D warnings
      # Hosted tests are explicit operator runs against synthetic data. CI never
      # receives payment/database credentials or creates provider resources.
